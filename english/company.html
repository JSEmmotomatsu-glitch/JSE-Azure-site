<style>
/* 画面幅が広いパソコン環境（900px以上）でのレイアウト調整 */
@media screen and (min-width: 900px) {

  /* 全体を横並びにして、4つ目以降は自動で下段に折り返す設定 */
  .list-normal {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: flex-start !important;
    gap: 25px 15px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  /* すべての項目を3分割の大きさに統一 */
  .list-normal .list {
    margin: 0 !important;
    float: none !important;
    display: flex !important;
    box-sizing: border-box !important;
    width: calc((100% - 30px) / 3) !important;
  }

  /* リンク全体のブロック化 */
  .list-normal .list a {
    display: block !important;
    width: 100% !important;
    text-decoration: none !important;
  }

  /* すべての画像設定（全体を真ん中基準に一括リセット） */
  .list-normal .list figure {
    width: 100% !important;
    margin: 0 0 10px 0 !important;
  }
  .list-normal .list figure img {
    width: 100% !important;
    height: 140px !important;
    object-fit: cover !important;
    object-position: center !important;
    filter: brightness(0.8);
  }

  /* 1番目の「代表あいさつ」だけ、画像を少し下に下げて頭の上を収める個別の設定 */
  .list-normal .list:nth-child(1) figure img {
    object-position: center 15% !important;
  }

  /* すべての文字設定（画像の下に白い文字で配置） */
  .list-normal .list .text {
    position: static !important;
    height: auto !important;
    text-align: center !important;
    padding: 5px 0 !important;
  }
  .list-normal .list .text h4 {
    margin: 0 !important;
    font-size: 1.1rem !important;
    font-weight: bold !important;
    color: #ffffff !important;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.4) !important;
  }
  .list-normal .list p {
    display: none !important;
  }

}
</style>
