<!--このテンプレート専用のスクリプト-->
<!-- ★修正：前回の回答に基づき、メニュー表示とハンバーガーメニューのバグを防ぐため、fetch完了後に読み込む形へ最適化しました -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuArea = document.getElementById("common-menu");
    if (menuArea) {
        fetch("/menu.html")
            .then(response => response.text())
            .then(data => {
                menuArea.innerHTML = data;
                
                // メニューが挿入された後にmain.jsを動的に読み込む
                const script = document.createElement("script");
                script.src = "/js/main.js";
                document.body.appendChild(script);
            })
            .catch(error => console.error("メニューの読み込みに失敗しました:", error));
    }
});
</script>
