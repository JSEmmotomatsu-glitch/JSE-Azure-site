<!-- ▼ 共通メニュー読み込み ＆ マップ連動ロジック ▼ -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. 共通メニューの読み込み（実証済みの安全な構文）
    const menuArea = document.getElementById("common-menu");
    if (menuArea) {
        fetch("/menu.html")
            .then(response => response.text())
            .then(data => {
                menuArea.innerHTML = data;
            });
    }

    // 2. アクセスページ専用：地図切り替えロジック
    const locationsData = {
        nagasaki: {
            title: "本社（長崎県長崎市）",
            desc: "〒850-0065 長崎県長崎市入船町130番",
            src: "https://google.com"
        },
        kanagawa: {
            title: "製造・販売拠点（神奈川県相模原市）",
            desc: "〒252-0254 神奈川県相模原市中央区下九沢1120",
            src: "https://google.com"
        }
    };

    const targetIframe = document.getElementById('jse-iframe-target');
    const targetTitle = document.getElementById('jse-map-title');
    const targetDesc = document.getElementById('jse-map-desc');

    const btnNagasaki = document.getElementById('jse-btn-nagasaki');
    const btnKanagawa = document.getElementById('jse-btn-kanagawa');

    if (btnNagasaki && btnKanagawa) {
        btnNagasaki.addEventListener('click', function() { execSwitch('nagasaki'); });
        btnKanagawa.addEventListener('click', function() { execSwitch('kanagawa'); });
    }

    function execSwitch(key) {
        if(targetIframe && locationsData[key]) {
            targetIframe.src = locationsData[key].src;
            targetTitle.textContent = locationsData[key].title;
            targetDesc.textContent = locationsData[key].desc;
        }
    }
});
</script>
