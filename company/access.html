<meta name="description" content="Japan Smart Energy合同会社の公式ホームページです。当社は定置用蓄電システム（ESS）用電極の製造および販売を行っております。神奈川県相模原市から、エネルギーの未来を支える高品質な製品をお届けします。">

<body>


<div id="container">

<header>

<div id="logo" style="margin: 0; padding: 0; display: flex; align-items: center; gap: 15px;">
    <!-- ロゴマーク -->
    <!-- ★ルートパスに変更：トップページ（ルート直下）へのリンク -->
    <a href="/index.html" style="display: block; line-height: 0;">
        <!-- ★ルートパスに変更：ロゴ画像の読み込み崩れを防止 -->

    <!-- 会社名テキスト -->
    <h1 style="margin: 0; padding: 0; font-size: 1.4rem; font-weight: 700; line-height: 1.35; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; letter-spacing: 0.02em; text-align: left;">
        <!-- ★ルートパスに変更 -->
        <a href="/index.html" style="text-decoration: none; color: #ffffff; display: block; text-align: left;">
            <span style="display: block; text-align: left; text-indent: 0; padding-left: 0; margin-left: 0;">Japan Smart Energy <span style="font-weight: 700; font-size: 0.85em; margin-left: 1px;">合同会社</span></span>
            <span style="display: block; text-align: left; text-indent: 0; padding-left: 0; margin-left: 0;">Japan Smart Energy <span style="font-weight: 500; font-size: 0.85em; opacity: 0.9; margin-left: 1px;">G.K.</span></span>
        </a>
    </h1>
</div>

</header>


<div id="contents">


<main>

<section>

<h2>アクセス</h2>
<!-- ▼ 本社を上向き・相模原を下向きに分けたコード ▼ -->
<div class="map-interactive-container" style="position: relative; width: 100%; max-width: 800px; margin: 30px auto; font-family: sans-serif;">
    
    <!-- 日本地図画像 -->
    <img src="/images/map.jpg" alt="日本地図" style="width: 100%; height: auto; display: block;">

    <style>
        /* 共通スタイル */
        .map-label {
            position: absolute;
            background-color: #ffffff;
            color: #333333 !important; /* 文字色を黒に固定 */
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            z-index: 5;
        }

        /* ーーー ① 本社（上向き：三角が上で文字が下） ーーー */
        #label-hq {
            /* 三角の【上先端】を基準に配置 */
            transform: translate(-50%, 0);
            margin-top: 6px; 
        }
        /* 本社：上側の三角 */
        #label-hq::after {
            content: "";
            position: absolute;
            bottom: 100%; /* 下ではなく上に配置 */
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent; /* 上を向く三角 */
        }

        /* ーーー ② 相模原工場（下向き：文字が上で三角が下） ーーー */
        #label-factory {
            /* 三角の【下先端】を基準に配置 */
            transform: translate(-50%, -100%);
            margin-top: -6px; 
        }
        /* 相模原：下側の三角 */
        #label-factory::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent; /* 下を向く三角 */
        }
    </style>

    <!-- ① 本社位置（上向き） -->
    <!-- ※三角の「上の頂点」がこの left/top の位置にピタッと合います -->
    <div id="label-hq" class="map-label" style="left: 18.5%; top: 81.5%;">
        本社
    </div>

    <!-- ② 相模原工場位置（下向き） -->
    <!-- ※三角の「下の頂点」がこの left/top の位置にピタッと合います -->
    <div id="label-factory" class="map-label" style="left: 58.2%; top: 58.2%;">
        相模原工場
    </div>

</div>
<!-- ▲ ここまで ▲ -->

</section>

</main>

<!-- ▼ ここから下を貼り付けます ▼ -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuArea = document.getElementById("common-menu");
    if (menuArea) {
        fetch("/menu.html")
            .then(response => response.text())
            .then(data => {
                menuArea.innerHTML = data;
            });
    }
});
</script>
