<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Japan Smart Energy 合同会社</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Japan Smart Energy合同会社の公式ホームページです。当社は定置用蓄電システム（ESS）用電極の製造および販売を行っております。">

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
.home-main {
    min-width: 0;
}

#mainimg.home-hero {
    margin: 0;
    overflow: hidden;
    position: relative;
    width: 100%;
}

#mainimg.home-hero > img {
    display: block;
    height: clamp(280px, 24vw, 420px);
    object-fit: cover;
    object-position: center;
    width: 100%;
}

#mainimg.home-hero .home-hero-copy {
    background: rgba(0, 68, 72, 0.82);
    color: #ffffff;
    font-size: clamp(1rem, 1.7vw, 1.35rem);
    font-weight: 700;
    line-height: 1.5;
    margin: 0;
    padding: 14px 24px;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
}

@media screen and (max-width: 600px) {
    #mainimg.home-hero > img {
        height: 260px;
    }

    #mainimg.home-hero .home-hero-copy {
        font-size: 1rem;
        padding: 11px 14px;
    }
}
</style>
</head>

<body>

<div id="container">

<header>

<div id="logo" style="margin: 0; padding: 0; display: flex; align-items: center; gap: 15px;">
    <a href="/" style="display: block; line-height: 0;">
        <img src="/images/logo.png" alt="Japan Smart Energy ロゴ" style="height: 52px; width: auto; display: block;">
    </a>

    <h1 style="margin: 0; padding: 0; font-size: 1.7rem; font-weight: 700; line-height: 1.35; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; letter-spacing: 0.02em; text-align: left;">
        <a href="/" style="text-decoration: none; color: #ffffff; display: block; text-align: left;">
            Japan Smart Energy 合同会社
        </a>
    </h1>
    <a class="language-switch" href="/english/" lang="en" hreflang="en">English</a>
</div>

</header>

<div id="contents">

<main class="home-main">

<aside id="mainimg" class="home-hero">
    <img src="/images/indeximage-banner-v5.png" alt="相模原からアメリカへ広がるESS電極とエネルギー技術のイメージ">
    <p class="home-hero-copy">エネルギーとデジタルの力で、持続可能な未来へ。</p>
</aside>

</main>

<!-- 開閉ブロック -->
<div id="menubar">

<h3>MENU</h3>

<nav id="common-menu">
<!-- MENUはmenu.htmlで定義 -->
</nav>

</div>
<!-- /#menubar -->

</div>
<!-- /#contents -->

<footer>
<small>Copyright&copy; <a href="/">Japan Smart Energy 合同会社</a> All Rights Reserved.</small>
<span class="pr"><a href="https://template-party.com/" target="_blank" rel="noopener noreferrer">《Web Design:Template-Party》</a></span>
</footer>

</div>
<!-- /#container -->

<div class="pagetop"><a href="#">▲</a></div>

<div id="menubar_hdr">
<div class="menu-icon">
<span></span><span></span><span></span>
</div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="/js/main.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuArea = document.getElementById("common-menu");
    if (menuArea) {
        fetch("/menu.html")
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Menu could not be loaded.");
                }
                return response.text();
            })
            .then(function(data) {
                menuArea.innerHTML = data;
            })
            .catch(function() {
                menuArea.innerHTML = "";
            });
    }
});
</script>

</body>
</html>
