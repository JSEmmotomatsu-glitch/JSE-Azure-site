<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuArea = document.getElementById("common-menu");
    if (menuArea) {
        fetch("/menu.html")
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Menu could not be loaded.");
                }
                return response.text();
            })
            .then(function(data) {
                menuArea.innerHTML = data;
            })
            .catch(function() {
                menuArea.innerHTML = "";
            });
    }
});
