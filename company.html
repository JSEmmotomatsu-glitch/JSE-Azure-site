<style>
/* 画面幅が広いパソコン環境（900px以上）でのレイアウト調整 */
@media screen and (min-width: 900px) {

  /* 全体を横並びにして、4つ目以降は自動で下段に折り返す設定 */
  .list-normal {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: flex-start !important; /* 左詰めで並べる */
    gap: 25px 15px !important;              /* 横の隙間15px、縦の隙間25px */
    width: 100% !important;
    box-sizing: border-box !important;
  }

  /* 既存テンプレートの干渉をクリアし、すべての項目を3分割の大きさに統一 */
  .list-normal .list {
    margin: 0 !important;
    float: none !important;
    display: flex !important;
    box-sizing: border-box !important;
    width: calc((100% - 30px) / 3) !important; /* 横に3つずつ綺麗に並ぶ幅 */
  }

  /* リンク全体のブロック化 */
  .list-normal .list a {
    display: block !important;
    width: 100% !important;
    text-decoration: none !important;
  }

  /* すべての画像設定（大きさを一元化） */
  .list-normal .list figure {
    width: 100% !important;
    margin: 0 0 10px 0 !important; /* 画像の下に10pxの隙間を作る */
  }
  .list-normal .list figure img {
    width: 100% !important;
    height: 140px !important;      /* すべての画像の高さを140pxに統一 */
    object-fit: cover !important;
    filter: brightness(0.8);
  }

  /* すべての文字設定（画像の下に白い文字で配置） */
  .list-normal .list .text {
    position: static !important;   /* 重なりを確実に解除 */
    height: auto !important;
    text-align: center !important; /* 文字を中央寄せにする */
    padding: 5px 0 !important;
  }
  .list-normal .list .text h4 {
    margin: 0 !important;
    font-size: 1.1rem !important;
    font-weight: bold !important;
    color: #ffffff !important;     /* 緑背景でもクッキリ見えるように白文字に変更 */
    text-shadow: 1px 1px 4px rgba(0,0,0,0.4) !important; /* 薄い影をつけて読みやすく */
  }
  .list-normal .list p {
    display: none !important;      /* 空のpタグによる余計な隙間を非表示に */
  }

} /* パソコン用の設定（@media）をここで閉じます */
</style>
